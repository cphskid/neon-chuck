<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>東寧遺事：鄭荷台灣記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Serif+TC:wght@600;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f1013;
    --panel:#241a14;
    --panel-edge:#4a3324;
    --panel-edge-lit:#6b4a30;
    --gold:#e8c468;
    --gold-dim:#a9863f;
    --paper:#f0e0c0;
    --food:#7fae4a;
    --military:#c23b22;
    --reputation:#3f7cac;
    --wealth:#d4a72c;
    --sky-top:#101a33;
    --sky-bottom:#e8935a;
    --accent:#c23b22;
    --danger:#c23b22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  .hidden{display:none !important;}
  html,body{
    height:100%; margin:0; overflow:hidden; background:#000; color:var(--paper);
    font-family:'VT323',monospace; font-size:20px;
  }
  .pixel-font{ font-family:'Press Start 2P', monospace; }
  #app{
    position:fixed; inset:0; display:flex; flex-direction:column;
    background:#000;
  }

  /* ---------- HUD ---------- */
  #hud{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:6px 10px; background:linear-gradient(180deg,#1a120c,#0f0a07);
    border-bottom:2px solid var(--panel-edge); z-index:20;
  }
  #hud .stat{ display:flex; align-items:center; gap:4px; flex:1; min-width:0; }
  #hud .stat .icon{ font-size:14px; flex:0 0 auto; }
  #hud .stat .track{ flex:1; height:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:2px; overflow:hidden; min-width:20px; }
  #hud .stat .fill{ height:100%; transition:width .5s ease; }
  #hud .stat .num{ font-family:'Press Start 2P',monospace; font-size:8px; color:var(--paper); flex:0 0 auto; width:20px; text-align:right; }
  #hud .chtitle{
    font-family:'Press Start 2P',monospace; font-size:8px; color:var(--gold-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:28vw; flex:0 0 auto;
    cursor:pointer; padding:2px 4px;
  }
  #hud .muteBtn{
    flex:0 0 auto; cursor:pointer; font-size:15px; line-height:1;
    padding:3px 5px; border:1px solid var(--panel-edge-lit); border-radius:4px;
  }
  #hud .muteBtn:active{ background:rgba(232,196,104,0.18); }
  .audioRow{ display:flex; gap:10px; margin-top:16px; }
  .audioTgl{
    font-family:'Press Start 2P',monospace; font-size:9px; cursor:pointer;
    padding:7px 12px; border-radius:4px; border:2px solid var(--panel-edge-lit);
    color:var(--gold-dim); opacity:.5;
  }
  .audioTgl.on{ color:var(--gold); border-color:var(--gold-dim); opacity:1; }

  /* ---------- Canvas stage ---------- */
  #stage{ position:relative; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden; }
  #gameCanvas{ image-rendering:pixelated; image-rendering:crisp-edges; display:block; background:#101a33; }

  .prompt-toast{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(15,16,19,0.9); border:1px solid var(--gold-dim); color:var(--gold);
    padding:4px 12px; font-size:14px; border-radius:3px; pointer-events:none; opacity:0; transition:opacity .3s;
    z-index:15; white-space:nowrap;
  }
  .prompt-toast.show{ opacity:1; }

  /* ---------- Touch controls ---------- */
  #touchControls{ position:absolute; inset:0; pointer-events:none; z-index:12; }
  .tbtn{
    position:absolute; pointer-events:auto; width:56px; height:56px; border-radius:50%;
    background:rgba(232,196,104,0.14); border:2px solid rgba(232,196,104,0.55);
    color:var(--gold); font-size:22px; display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none;
  }
  .tbtn:active{ background:rgba(232,196,104,0.32); }
  #btnLeft{ left:14px; bottom:14px; }
  #btnRight{ left:80px; bottom:14px; }
  #btnInteract{ right:14px; bottom:14px; width:64px; height:64px; font-size:14px; font-family:'Press Start 2P',monospace; text-align:center; line-height:1.2; }

  /* ---------- Dialogue panel ---------- */
  #dialoguePanel{
    flex:0 0 auto; background:linear-gradient(180deg,#2a1c14,#180f0a);
    border-top:3px solid var(--panel-edge-lit); padding:10px 12px 12px; z-index:20;
    display:flex; flex-direction:column; gap:6px;
  }
  #dlgHeader{ display:flex; align-items:center; gap:10px; }
  #dlgPortrait{ width:42px; height:42px; border-radius:4px; border:2px solid var(--gold-dim); background:#101a33; flex:0 0 auto; }
  #dlgName{ font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold); }
  #dlgRole{ font-size:14px; color:var(--gold-dim); }
  #dlgText{ font-size:21px; line-height:1.35; min-height:2.7em; color:var(--paper); }
  #dlgFooter{ display:flex; justify-content:flex-end; }
  #dlgContinue{ font-family:'Press Start 2P',monospace; font-size:9px; color:var(--gold); cursor:pointer; padding:4px 8px; animation:blink 1.1s infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  #dlgChoices{ display:flex; flex-direction:column; gap:6px; }
  .choiceBtn{
    text-align:left; background:#332216; border:2px solid var(--panel-edge-lit); color:var(--paper);
    padding:8px 10px; font-family:'VT323',monospace; font-size:19px; border-radius:3px; cursor:pointer;
  }
  .choiceBtn:active{ background:#4a3324; }
  .choiceImpact{ display:block; font-family:'Press Start 2P',monospace; font-size:7px; color:var(--gold-dim); margin-top:3px; }

  /* ---------- Narration (prologue/epilogue) ---------- */
  #narrationScreen{
    position:absolute; inset:0; z-index:30; background:radial-gradient(ellipse at center, #1b2440 0%, #0a0d18 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  #narrationScreen .eyebrow{ font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold-dim); letter-spacing:2px; margin-bottom:18px; }
  #narrationScreen .body{ font-size:24px; line-height:1.6; max-width:640px; color:var(--paper); min-height:5.5em; }
  #narrationScreen .cont{ margin-top:26px; font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold); cursor:pointer; animation:blink 1.1s infinite; }

  /* ---------- Chapter transition card ---------- */
  #chapterCard{
    position:absolute; inset:0; z-index:25; background:#0a0d18; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px;
  }
  #chapterCard .num{ font-family:'Press Start 2P',monospace; font-size:11px; color:var(--gold-dim); margin-bottom:10px; }
  #chapterCard .name{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:clamp(24px,7vw,40px); color:var(--gold); text-shadow:0 0 18px rgba(232,196,104,0.4); }
  #chapterCard .sub{ margin-top:10px; font-size:18px; color:var(--paper); opacity:.8; }

  /* ---------- Title screen ---------- */
  #titleScreen{
    position:absolute; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 30% 20%, rgba(232,196,104,0.10), transparent 45%),
      linear-gradient(180deg,#0d1226 0%, #1c1420 55%, #2c1c14 100%);
    text-align:center; padding:24px; gap:8px;
  }
  #titleScreen h1{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:clamp(28px,8vw,46px); color:var(--gold); margin:0; text-shadow:0 0 22px rgba(232,196,104,0.45); }
  #titleScreen .sub{ font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold-dim); letter-spacing:3px; margin-bottom:18px; }
  .menuBtn{
    font-family:'Press Start 2P',monospace; font-size:11px; color:var(--ink); background:var(--gold);
    border:none; padding:12px 26px; border-radius:3px; cursor:pointer; min-width:220px;
    box-shadow:0 3px 0 var(--gold-dim);
  }
  .menuBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--gold-dim); }
  .menuBtn.secondary{ background:transparent; color:var(--gold); border:2px solid var(--gold-dim); box-shadow:none; }
  #titleScreen .howto{ margin-top:22px; font-size:15px; color:var(--paper); opacity:.7; max-width:420px; line-height:1.5; }

  /* ---------- Rotate overlay ---------- */
  #rotateOverlay{
    position:fixed; inset:0; z-index:90; background:#0a0d18; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:14px; padding:24px;
  }
  #rotateOverlay .icon{ font-size:56px; animation:rotatePulse 1.6s ease-in-out infinite; }
  @keyframes rotatePulse{ 0%,100%{ transform:rotate(0deg); } 50%{ transform:rotate(-90deg); } }
  #rotateOverlay p{ font-size:20px; max-width:320px; }
  #rotateOverlay .dismiss{ margin-top:8px; font-size:15px; color:var(--gold-dim); text-decoration:underline; cursor:pointer; }

  /* ---------- Modals (achievements / dev / ending) ---------- */
  .modalBackdrop{ position:fixed; inset:0; z-index:60; background:rgba(10,10,14,0.72); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modalPanel{ background:var(--panel); border:2px solid var(--panel-edge-lit); border-radius:6px; padding:18px; max-width:420px; width:100%; max-height:85vh; display:flex; flex-direction:column; }
  .modalPanel h2{ font-family:'Press Start 2P',monospace; font-size:14px; color:var(--gold); margin:0 0 12px; display:flex; justify-content:space-between; align-items:center; }
  .modalPanel h2 .x{ cursor:pointer; font-size:20px; color:var(--gold-dim); }
  .modalPanel .scroll{ overflow-y:auto; padding-right:2px; }
  .achRow{ display:flex; gap:10px; align-items:center; border:1px solid var(--panel-edge-lit); border-radius:4px; padding:8px 10px; margin-bottom:8px; background:rgba(0,0,0,0.2); }
  .achRow.locked{ filter:grayscale(1); opacity:.5; }
  .achRow .ic{ font-size:22px; flex:0 0 auto; }
  .achRow .name{ font-family:'Press Start 2P',monospace; font-size:10px; color:var(--paper); margin-bottom:3px; }
  .achRow .desc{ font-size:15px; color:var(--gold-dim); }
  .sectionLabel{ font-family:'Press Start 2P',monospace; font-size:10px; color:var(--gold-dim); margin:14px 0 8px; border-bottom:1px solid var(--panel-edge-lit); padding-bottom:6px; }
  .sectionLabel:first-child{ margin-top:0; }
  .devRow{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; font-size:18px; }
  .toggleSw{ width:46px; height:26px; background:#3a2a1e; border:2px solid var(--panel-edge-lit); border-radius:999px; position:relative; cursor:pointer; flex:0 0 auto; }
  .toggleSw.on{ background:var(--military); }
  .toggleSw .knob{ position:absolute; top:1px; left:1px; width:18px; height:18px; background:var(--paper); border-radius:999px; transition:transform .2s; }
  .toggleSw.on .knob{ transform:translateX(20px); }
  .devBtn{ width:100%; text-align:left; background:#3a2a1e; border:2px solid var(--panel-edge-lit); color:var(--paper); padding:10px 12px; border-radius:4px; font-family:'VT323',monospace; font-size:18px; cursor:pointer; margin-top:6px; }
  .toast{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:80; background:#241a14; border:2px solid var(--gold); color:var(--gold); padding:8px 16px; border-radius:5px; font-family:'Press Start 2P',monospace; font-size:9px; }

  #endingEmoji{ font-size:44px; text-align:center; }
  #endingTitle{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:26px; color:var(--gold); text-align:center; margin:6px 0; }
  #endingText{ font-size:19px; line-height:1.5; text-align:center; }
  #endingNote{ font-size:16px; line-height:1.5; text-align:center; color:var(--gold-dim); margin-top:8px; }

  .cheatBanner{
    position:absolute; top:6px; left:50%; transform:translateX(-50%); z-index:16;
    font-family:'Press Start 2P',monospace; font-size:8px; color:#ff6b5b; background:rgba(0,0,0,0.55);
    border:1px solid #ff6b5b; padding:3px 8px; border-radius:3px; animation:blink 1.4s infinite;
  }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="stat"><span class="icon">🌾</span><div class="track"><div class="fill" id="fillFood" style="background:var(--food);width:50%;"></div></div><span class="num" id="numFood">50</span></div>
    <div class="stat"><span class="icon">⚔️</span><div class="track"><div class="fill" id="fillMilitary" style="background:var(--military);width:50%;"></div></div><span class="num" id="numMilitary">50</span></div>
    <div class="stat"><span class="icon">🤝</span><div class="track"><div class="fill" id="fillReputation" style="background:var(--reputation);width:50%;"></div></div><span class="num" id="numReputation">50</span></div>
    <div class="stat"><span class="icon">💰</span><div class="track"><div class="fill" id="fillWealth" style="background:var(--wealth);width:50%;"></div></div><span class="num" id="numWealth">50</span></div>

  </div>

  <div id="stage">
    <canvas id="gameCanvas"></canvas>
    <div class="prompt-toast" id="promptToast"></div>
    <div id="cheatBanner" class="cheatBanner hidden">⚠ 上帝視角作弊中</div>

    <div id="touchControls" class="hidden">
      <div class="tbtn" id="btnLeft">◀</div>
      <div class="tbtn" id="btnRight">▶</div>

    <div id="chapterCard" class="hidden">
      <div class="num pixel-font" id="chapterCardNum">第一章</div>

    <div id="narrationScreen" class="hidden">
      <div class="eyebrow pixel-font" id="narrEyebrow">序章</div>

      <div class="cont pixel-font" id="narrCont">▶ 繼續</div>
    </div>

    <div id="titleScreen">
      <h1 id="gameTitleClicker">東寧遺事</h1>
      <div class="sub">鄭荷台灣記・1661—1662</div>
      <button class="menuBtn" id="btnNewGame">開始新遊戲</button>
      <button class="menuBtn secondary hidden" id="btnContinue" style="margin-top:10px;">繼續進度</button>
      <button class="menuBtn secondary" id="btnTitleAchievements" style="margin-top:10px;">📜 成就圖鑑</button>
      <div class="audioRow">
        <span class="audioTgl on" id="tglBgm">♪ 音樂</span>
        <span class="audioTgl on" id="tglSfx">🔔 音效</span>
      </div>
      <div class="howto">方向鍵 ◀▶ 或畫面按鈕行走，靠近路人後按空白鍵／互動鈕開始對話。手機請橫放遊玩。</div>
    </div>

  </div>

  <div id="dialoguePanel" class="hidden">
    <div id="dlgHeader">
      <canvas id="dlgPortrait" width="42" height="42"></canvas>
      <div>
        <div id="dlgName" class="pixel-font">名字</div>
        <div id="dlgRole">身份</div>
      </div>
    </div>
    <div id="dlgText">文字內容</div>
    <div id="dlgChoices" class="hidden"></div>
    <div id="dlgFooter">
      <div id="dlgContinue" class="pixel-font">▶ 繼續</div>
    </div>
  </div>

</div>

<div id="rotateOverlay" class="hidden">
  <div class="icon">📱</div>
  <p>請將手機橫放，以獲得完整的橫向捲軸體驗</p>
  <div class="dismiss" id="dismissRotate">仍要直式遊玩 →</div>
</div>

<div id="achievementModal" class="modalBackdrop hidden">
  <div class="modalPanel">
    <h2>📜 成就圖鑑 <span class="x" id="closeAch">&times;</span></h2>
    <div class="scroll">
      <div class="sectionLabel">結局成就</div>
      <div id="endingAchList"></div>
      <div class="sectionLabel">行為成就</div>
      <div id="behaviorAchList"></div>
    </div>
  </div>
</div>

<div id="devMenu" class="modalBackdrop hidden">
  <div class="modalPanel">
    <h2>🛠️ 開發者選單 <span class="x" id="closeDevMenu">&times;</span></h2>
    <div class="devRow"><span>上帝視角</span><div class="toggleSw" id="godModeToggle"><div class="knob"></div></div></div>
    <button class="devBtn" id="maxStatsBtn">📈 資源全滿（回到 80）</button>
    <button class="devBtn" id="unlockAllBtn">🔓 一鍵解鎖全圖鑑</button>
    <button class="devBtn" id="skipChapterBtn">⏭️ 跳至下一章（測試用）</button>
  </div>
</div>

<div id="endingModal" class="modalBackdrop hidden">
  <div class="modalPanel">
    <div id="endingEmoji">🏯</div>
    <div id="endingTitle">結局標題</div>
    <div id="endingText">結局說明</div>
    <div id="endingNote">個人化備註</div>
    <button class="menuBtn" id="endingRestartBtn" style="margin-top:16px; width:100%;">回到標題畫面</button>
  </div>
</div>

<div id="achToast" class="toast hidden">🏆 成就解鎖</div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONSTANTS
===================================================================== */
const LW = 480, LH = 270;         // logical canvas resolution
const GROUND_Y = 210;             // baseline y for character feet
const PX = 4;                     // logical pixels per sprite-grid cell
const SPEED = 90;                 // world units / second
const INTERACT_RANGE = 46;
const STORAGE_KEY = 'taiwan1661_rpg_v1';
const AUDIO_KEY = 'taiwan1661_rpg_audio';

/* =====================================================================
   AUDIO ENGINE — procedural chiptune (no external assets; CSP blocks them)
   Square/triangle leads + noise percussion, pentatonic scales.
===================================================================== */
const SEMITONE = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function noteFreq(note){
  if(!note || note === '-') return 0;
  const m = /^([A-G]#?)(-?\d)$/.exec(note);
  if(!m) return 0;
  const midi = SEMITONE[m[1]] + (parseInt(m[2],10)+1)*12;
  return 440 * Math.pow(2, (midi-69)/12);
}

// Patterns are at 8th-note resolution. '-' = rest.
const TRACKS = {
  // Stately, D minor pentatonic (D F G A C) — sparse and ceremonial.
  title:{
    bpm:78,
    voices:[
      { wave:'square', gain:0.13, len:0.9, pattern:[
        'D4','-','-','-','F4','-','A4','-',
        'G4','-','-','-','F4','-','D4','-',
        'A3','-','C4','-','D4','-','F4','-',
        'D4','-','-','-','-','-','-','-'
      ]},
      { wave:'triangle', gain:0.22, len:1.6, pattern:[
        'D2','-','-','-','D2','-','-','-',
        'A2','-','-','-','A2','-','-','-',
        'F2','-','-','-','F2','-','-','-',
        'D2','-','-','-','A2','-','-','-'
      ]},
      { wave:'triangle', gain:0.07, len:3.0, pattern:[
        'A3','-','-','-','-','-','-','-',
        'D4','-','-','-','-','-','-','-',
        'C4','-','-','-','-','-','-','-',
        'A3','-','-','-','-','-','-','-'
      ]}
    ],
    perc:null
  },
  // Movement, D major pentatonic (D E F# A B) — the travelling/field theme.
  field:{
    bpm:104,
    voices:[
      { wave:'square', gain:0.11, len:0.8, pattern:[
        'D4','-','E4','F#4','A4','-','F#4','-',
        'E4','-','D4','-','B3','-','D4','-',
        'F#4','-','A4','-','B4','-','A4','F#4',
        'E4','-','D4','-','-','-','-','-'
      ]},
      { wave:'triangle', gain:0.2, len:0.9, pattern:[
        'D2','-','D2','-','A2','-','A2','-',
        'B2','-','B2','-','F#2','-','F#2','-',
        'G2','-','G2','-','D2','-','D2','-',
        'A2','-','A2','-','A2','-','A2','-'
      ]}
    ],
    perc:[
      'k','-','h','-','s','-','h','-',
      'k','-','h','-','s','-','h','-',
      'k','-','h','-','s','-','h','-',
      'k','-','h','k','s','-','h','h'
    ]
  }
};

const CHAPTER_AMBIENCE = {
  harbor:'waves', sea:'waves', provintia:'wind',
  town:'town', siege:'siege', camp:'night', gate:'wind'
};

const AUDIO = {
  ctx:null, ready:false,
  master:null, bgmGain:null, sfxGain:null, ambGain:null,
  noiseBuf:null,
  enabled:{ bgm:true, sfx:true },
  cur:{ track:null, ambience:null },
  seq:{ timer:null, step:0, nextTime:0, track:null },
  ambNodes:[], ambTimer:null,

  loadPrefs(){
    try{
      const raw = localStorage.getItem(AUDIO_KEY);
      if(raw) Object.assign(this.enabled, JSON.parse(raw));
    }catch(e){}
  },
  savePrefs(){
    try{ localStorage.setItem(AUDIO_KEY, JSON.stringify(this.enabled)); }catch(e){}
  },

  // Must be called from a user gesture (browsers block audio otherwise).
  unlock(){
    if(this.ready){
      if(this.ctx.state === 'suspended') this.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);

    this.bgmGain = this.ctx.createGain();
    this.bgmGain.gain.value = this.enabled.bgm ? 1 : 0;
    this.bgmGain.connect(this.master);

    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = this.enabled.sfx ? 1 : 0;
    this.sfxGain.connect(this.master);

    this.ambGain = this.ctx.createGain();
    this.ambGain.gain.value = this.enabled.bgm ? 0.55 : 0;
    this.ambGain.connect(this.master);

    // one shared noise buffer for percussion + ambience
    const len = this.ctx.sampleRate * 2;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;

    this.ready = true;
  },

  setEnabled(kind, on){
    this.enabled[kind] = on;
    this.savePrefs();
    if(!this.ready) return;
    const t = this.ctx.currentTime;
    if(kind === 'bgm'){
      this.bgmGain.gain.setTargetAtTime(on?1:0, t, 0.05);
      this.ambGain.gain.setTargetAtTime(on?0.55:0, t, 0.05);
    } else {
      this.sfxGain.gain.setTargetAtTime(on?1:0, t, 0.05);
    }
  },

  /* ---------- primitives ---------- */
  tone(o){
    if(!this.ready) return;
    const t0 = o.t || this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = o.wave || 'square';
    osc.frequency.setValueAtTime(o.freq, t0);
    if(o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1,o.slideTo), t0 + o.dur);
    const peak = o.gain != null ? o.gain : 0.2;
    const atk = o.attack != null ? o.attack : 0.008;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    osc.connect(g);
    g.connect(o.dest || this.sfxGain);
    osc.start(t0);
    osc.stop(t0 + o.dur + 0.02);
  },

  noise(o){
    if(!this.ready) return;
    const t0 = o.t || this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const filt = this.ctx.createBiquadFilter();
    filt.type = o.filter || 'lowpass';
    filt.frequency.setValueAtTime(o.freq || 1000, t0);
    if(o.freqTo) filt.frequency.exponentialRampToValueAtTime(Math.max(40,o.freqTo), t0 + o.dur);
    const g = this.ctx.createGain();
    const peak = o.gain != null ? o.gain : 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(filt); filt.connect(g); g.connect(o.dest || this.sfxGain);
    src.start(t0);
    src.stop(t0 + o.dur + 0.02);
  },

  /* ---------- SFX ---------- */
  sfx(name){
    if(!this.ready || !this.enabled.sfx) return;
    const t = this.ctx.currentTime;
    switch(name){
      case 'blip':
        this.tone({freq: 700 + Math.random()*90, wave:'square', dur:0.028, gain:0.05});
        break;
      case 'step':
        this.noise({freq:520, dur:0.05, gain:0.035, filter:'lowpass'});
        break;
      case 'talk':
        this.tone({freq:520, wave:'square', dur:0.07, gain:0.09});
        this.tone({freq:780, wave:'square', dur:0.09, gain:0.07, t:t+0.06});
        break;
      case 'select':
        this.tone({freq:620, wave:'square', dur:0.06, gain:0.1});
        this.tone({freq:930, wave:'square', dur:0.1, gain:0.09, t:t+0.05});
        break;
      case 'confirm':
        this.tone({freq:440, wave:'square', dur:0.08, gain:0.1});
        this.tone({freq:660, wave:'square', dur:0.12, gain:0.09, t:t+0.07});
        break;
      case 'statUp':
        [523,659,880].forEach((f,i)=> this.tone({freq:f, wave:'square', dur:0.11, gain:0.075, t:t+i*0.055}));
        break;
      case 'statDown':
        [392,294].forEach((f,i)=> this.tone({freq:f, wave:'square', dur:0.16, gain:0.08, t:t+i*0.075}));
        break;
      case 'achievement':
        [523,659,784,1047].forEach((f,i)=> this.tone({freq:f, wave:'square', dur:0.16, gain:0.085, t:t+i*0.085}));
        break;
      case 'chapter':
        this.tone({freq:110, wave:'triangle', dur:1.6, gain:0.24, attack:0.01});
        this.noise({freq:1800, freqTo:200, dur:1.4, gain:0.1, filter:'lowpass'});
        break;
      case 'cannon':
        this.noise({freq:420, freqTo:60, dur:0.9, gain:0.16, filter:'lowpass', dest:this.ambGain});
        break;
      case 'ending':
        [262,330,392,523].forEach((f,i)=> this.tone({freq:f, wave:'triangle', dur:1.8, gain:0.11, t:t+i*0.13}));
        break;
    }
  },

  /* ---------- BGM sequencer (lookahead scheduling) ---------- */
  playBgm(id){
    if(!this.ready || this.cur.track === id) return;
    this.stopBgm();
    const track = TRACKS[id];
    if(!track) return;
    this.cur.track = id;
    this.seq.track = track;
    this.seq.step = 0;
    this.seq.nextTime = this.ctx.currentTime + 0.1;
    this.seq.timer = setInterval(()=>this.scheduler(), 25);
  },

  stopBgm(){
    if(this.seq.timer){ clearInterval(this.seq.timer); this.seq.timer = null; }
    this.cur.track = null;
    this.seq.track = null;
  },

  scheduler(){
    const s = this.seq;
    if(!s.track || !this.ctx) return;
    const stepDur = 60 / s.track.bpm / 2; // 8th notes
    while(s.nextTime < this.ctx.currentTime + 0.15){
      this.scheduleStep(s.track, s.step, s.nextTime, stepDur);
      s.step++;
      s.nextTime += stepDur;
    }
  },

  scheduleStep(track, step, when, stepDur){
    track.voices.forEach(v=>{
      const note = v.pattern[step % v.pattern.length];
      const f = noteFreq(note);
      if(f > 0){
        this.tone({freq:f, wave:v.wave, dur:stepDur*(v.len||0.9), gain:v.gain, t:when, dest:this.bgmGain});
      }
    });
    if(track.perc){
      const hit = track.perc[step % track.perc.length];
      if(hit === 'k'){
        this.tone({freq:150, slideTo:48, wave:'triangle', dur:0.16, gain:0.3, t:when, dest:this.bgmGain});
      } else if(hit === 's'){
        this.noise({freq:2400, dur:0.13, gain:0.11, filter:'highpass', t:when, dest:this.bgmGain});
      } else if(hit === 'h'){
        this.noise({freq:7000, dur:0.04, gain:0.045, filter:'highpass', t:when, dest:this.bgmGain});
      }
    }
  },

  /* ---------- Ambience ---------- */
  setAmbience(kind){
    if(!this.ready || this.cur.ambience === kind) return;
    this.stopAmbience();
    this.cur.ambience = kind;
    if(!kind) return;

    const mk = (filterType, freq, gain, lfoRate, lfoDepth)=>{
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuf; src.loop = true;
      const filt = this.ctx.createBiquadFilter();
      filt.type = filterType; filt.frequency.value = freq;
      const g = this.ctx.createGain(); g.gain.value = gain;
      if(lfoRate){
        const lfo = this.ctx.createOscillator();
        const lg = this.ctx.createGain();
        lfo.frequency.value = lfoRate; lg.gain.value = lfoDepth;
        lfo.connect(lg); lg.connect(g.gain); lfo.start();
        this.ambNodes.push(lfo);
      }
      src.connect(filt); filt.connect(g); g.connect(this.ambGain);
      src.start();
      this.ambNodes.push(src);
      return g;
    };

    if(kind === 'waves')      mk('lowpass', 420, 0.10, 0.13, 0.055);
    else if(kind === 'wind')  mk('bandpass', 720, 0.075, 0.09, 0.035);
    else if(kind === 'town')  mk('lowpass', 300, 0.05, 0.22, 0.018);
    else if(kind === 'siege'){ mk('bandpass', 640, 0.06, 0.11, 0.03); }
    else if(kind === 'night') mk('lowpass', 240, 0.035, 0.07, 0.012);

    // sparse one-shots layered over the bed
    if(kind === 'siege' || kind === 'waves'){
      const fire = ()=>{
        if(this.cur.ambience !== kind) return;
        if(Math.random() < (kind==='siege' ? 0.75 : 0.3)) this.sfxAmbient('cannon');
        this.ambTimer = setTimeout(fire, 4000 + Math.random()*9000);
      };
      this.ambTimer = setTimeout(fire, 3000 + Math.random()*5000);
    }
    if(kind === 'night'){
      const chirp = ()=>{
        if(this.cur.ambience !== kind) return;
        const base = 3600 + Math.random()*1600;
        for(let i=0;i<3;i++){
          this.tone({freq:base, wave:'sine', dur:0.035, gain:0.02,
                     t:this.ctx.currentTime + i*0.06, dest:this.ambGain});
        }
        this.ambTimer = setTimeout(chirp, 700 + Math.random()*2200);
      };
      this.ambTimer = setTimeout(chirp, 500 + Math.random()*1200);
    }
  },

  // ambience one-shots bypass the sfx mute (they belong to the BGM/atmosphere bus)
  sfxAmbient(name){
    if(!this.ready || !this.enabled.bgm) return;
    if(name === 'cannon'){
      this.noise({freq:420, freqTo:60, dur:0.9, gain:0.14, filter:'lowpass', dest:this.ambGain});
    }
  },

  stopAmbience(){
    if(this.ambTimer){ clearTimeout(this.ambTimer); this.ambTimer = null; }
    this.ambNodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
    this.ambNodes = [];
    this.cur.ambience = null;
  }
};

/* =====================================================================
   SPRITE RENDERING (procedural pixel-block humanoids)
===================================================================== */
function drawHumanoid(ctx, wx, groundY, opts, facing, walking, t){
  // opts: {skin,hair,robe,robe2,accent,headwear,headwearColor}
  const bob = walking ? Math.sin(t*10)*2 : 0;
  const x = Math.round(wx);
  const gy = Math.round(groundY + bob);
  const flip = facing < 0;
  const g = (col,row,w,h,color)=>{
    const gx = flip ? -(col+w) : col;
    ctx.fillStyle = color;
    ctx.fillRect(x + gx*PX, gy - (16-row)*PX, w*PX, h*PX);
  };
  // legs (row 11-15)
  const legPhase = walking ? Math.sin(t*10) : 0;
  const legOffsetA = legPhase > 0 ? 1 : 0;
  const legOffsetB = legPhase > 0 ? 0 : 1;
  g(1,11,2,5+legOffsetA, opts.robe2);
  g(4,11,2,5+legOffsetB, opts.robe2);
  // feet
  g(1,16, 2, 0, opts.robe2);
  // torso
  g(0,5,7,7, opts.robe);
  // sash accent
  g(0,9,7,1, opts.accent);
  // arms
  const armSwing = walking ? Math.sin(t*10)*1.5 : 0;
  g(-1,6+Math.round(armSwing),1,4, opts.robe);
  g(7,6-Math.round(armSwing),1,4, opts.robe);
  // hands
  g(-1,10+Math.round(armSwing),1,1, opts.skin);
  g(7,10-Math.round(armSwing),1,1, opts.skin);
  // neck
  g(2,4,2,1, opts.skin);
  // head
  g(1,0,5,4, opts.skin);
  // headwear
  switch(opts.headwear){
    case 'topknot':
      g(2,-2,2,2, opts.hair);
      g(1,0,5,1, opts.hair);
      break;
    case 'cap':
      g(0,-1,7,2, opts.headwearColor || opts.hair);
      break;
    case 'hat':
      g(-1,-1,9,1, opts.headwearColor || '#2a2a2a');
      g(1,-3,5,2, opts.headwearColor || '#2a2a2a');
      break;
    case 'plume':
      g(-1,-1,9,1, opts.headwearColor || '#241a14');
      g(1,-4,5,3, opts.headwearColor || '#241a14');
      g(5,-6,1,3, opts.accent);
      break;
    case 'feather':
      g(1,-1,5,1, opts.hair);
      g(5,-5,1,4, opts.accent);
      g(6,-4,1,3, '#e8c468');
      break;
    default:
      g(1,-1,5,1, opts.hair);
  }
}

function drawPortrait(canvas, opts){
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0,0,42,42);
  ctx.fillStyle = '#101a33';
  ctx.fillRect(0,0,42,42);
  ctx.save();
  const scale = 0.73;
  ctx.translate(11,57.5);
  ctx.scale(scale,scale);
  drawHumanoid(ctx, 0, 0, opts, 1, false, 0);
  ctx.restore();
}

/* =====================================================================
   BACKGROUND THEMES
===================================================================== */
const SKY = {
  harbor:['#0d1530','#3a5570'], sea:['#0a1128','#1c4a5e'], provintia:['#241428','#7a4a3a'],
  town:['#101a33','#e0955e'], siege:['#150c18','#5c2a2a'], camp:['#080a14','#241830'],
  gate:['#1a0e10','#c9673f'], dawn:['#141428','#e8a15c']
};
function skyGrad(ctx, theme){
  const c = SKY[theme] || SKY.town;
  const grad = ctx.createLinearGradient(0,0,0,GROUND_Y+10);
  grad.addColorStop(0, c[0]);
  grad.addColorStop(1, c[1]);
  return grad;
}
function drawBackground(ctx, theme, camX, levelW){
  ctx.fillStyle = skyGrad(ctx, theme);
  ctx.fillRect(0,0,LW,GROUND_Y+10);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  for(let i=0;i<5;i++){
    const sx = ((i*137 - camX*0.05) % (LW+40) + (LW+40)) % (LW+40) - 20;
    ctx.globalAlpha = 0.5 - i*0.06;
    ctx.beginPath(); ctx.arc(sx, 30+ (i%3)*14, 1.4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  const far = -camX*0.3, mid = -camX*0.6;

  function repeatDraw(spacing, offset, drawFn){
    const start = Math.floor((camX-200)/spacing)*spacing;
    for(let wx=start; wx<camX+LW+200; wx+=spacing){ drawFn(wx+offset); }
  }

  ctx.save();
  if(theme==='harbor' || theme==='sea'){
    ctx.fillStyle = 'rgba(20,40,55,0.55)';
    repeatDraw(220, far, (wx)=>{
      const sx = wx - camX*0.3 - (far - -camX*0.3) + camX*0.3; // simplified below
    });
    // ship silhouettes (parallax 0.3)
    repeatDraw(260, 40, (wx)=>{
      const sx = wx*0.3 + far*0; const dx = wx - camX*0.3;
    });
  }
  ctx.restore();

  // --- simplified, robust parallax draw (world-space objects at factor f) ---
  function drawAtFactor(f, drawFn, spacing, seed){
    const camF = camX*f;
    const start = Math.floor((camF-100)/spacing)*spacing;
    for(let wx=start; wx<camF+LW+100; wx+=spacing){
      drawFn(wx - camF, wx+seed);
    }
  }

  if(theme==='harbor'){
    ctx.fillStyle = '#16263a';
    drawAtFactor(0.3, (sx,seed)=>{
      ctx.fillRect(sx, 150, 46, 30);
      ctx.beginPath(); ctx.moveTo(sx+23,150); ctx.lineTo(sx+23,110); ctx.lineTo(sx+27,150); ctx.fill();
    }, 260, 0);
  }
  if(theme==='sea'){
    ctx.fillStyle = '#0e2436';
    drawAtFactor(0.35, (sx)=>{ ctx.fillRect(sx,160,54,26); }, 300, 0);
    ctx.fillStyle = 'rgba(30,70,90,0.6)';
    drawAtFactor(0.7, (sx)=>{ ctx.fillRect(sx,GROUND_Y-6,120,6); }, 140, 0);
  }
  if(theme==='provintia' || theme==='siege' || theme==='gate'){
    ctx.fillStyle = '#3a2c28';
    drawAtFactor(0.3, (sx)=>{
      ctx.fillRect(sx,90,90,120);
      ctx.fillStyle='#241a18'; ctx.fillRect(sx+10,105,14,14); ctx.fillRect(sx+40,105,14,14); ctx.fillRect(sx+66,105,14,14);
      ctx.fillStyle='#3a2c28';
    }, 260, 0);
  }
  if(theme==='town'){
    ctx.fillStyle = '#2a2018';
    drawAtFactor(0.35, (sx)=>{
      ctx.fillRect(sx,120,70,90);
      ctx.fillStyle='#4a3324'; ctx.beginPath(); ctx.moveTo(sx-6,120); ctx.lineTo(sx+35,96); ctx.lineTo(sx+76,120); ctx.fill();
      ctx.fillStyle='#2a2018';
    }, 180, 0);
  }
  if(theme==='camp'){
    ctx.fillStyle = '#241a14';
    drawAtFactor(0.4, (sx)=>{
      ctx.beginPath(); ctx.moveTo(sx,GROUND_Y); ctx.lineTo(sx+22,168); ctx.lineTo(sx+44,GROUND_Y); ctx.fill();
    }, 130, 0);
  }

  // mid ground band
  ctx.fillStyle = theme==='sea' || theme==='harbor' ? '#123044' : '#3a2c1e';
  ctx.fillRect(0, GROUND_Y, LW, LH-GROUND_Y);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  drawAtFactor(1.0, (sx)=>{ ctx.fillRect(sx,GROUND_Y,2,LH-GROUND_Y); }, 24, 0);
}

function drawProp(ctx, sx, type){
  switch(type){
    case 'crate':
      ctx.fillStyle='#6b4a30'; ctx.fillRect(sx,GROUND_Y-16,18,16);
      ctx.strokeStyle='#3a2818'; ctx.lineWidth=1; ctx.strokeRect(sx+1,GROUND_Y-15,16,14);
      break;
    case 'barrel':
      ctx.fillStyle='#5c3a22'; ctx.fillRect(sx,GROUND_Y-20,14,20);
      ctx.fillStyle='#3a2414'; ctx.fillRect(sx,GROUND_Y-16,14,2); ctx.fillRect(sx,GROUND_Y-8,14,2);
      break;
    case 'cannon':
      ctx.fillStyle='#2a2a2a'; ctx.fillRect(sx,GROUND_Y-14,26,10);
      ctx.fillRect(sx+18,GROUND_Y-20,10,10);
      ctx.fillStyle='#4a3324'; ctx.fillRect(sx+2,GROUND_Y-4,22,6);
      break;
    case 'palm':
      ctx.fillStyle='#5c4020'; ctx.fillRect(sx,GROUND_Y-46,6,46);
      ctx.fillStyle='#3f6b2e';
      ctx.beginPath(); ctx.ellipse(sx+3,GROUND_Y-50,20,8,0.4,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(sx+3,GROUND_Y-50,20,8,-0.4,0,7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(sx+3,GROUND_Y-50,22,7,0,0,7); ctx.fill();
      break;
    case 'lantern':
      ctx.fillStyle='#241a14'; ctx.fillRect(sx+6,GROUND_Y-60,2,30);
      ctx.fillStyle='#e8c468'; ctx.fillRect(sx,GROUND_Y-32,14,14);
      ctx.fillStyle='#c23b22'; ctx.fillRect(sx+2,GROUND_Y-30,10,10);
      break;
    case 'net':
      ctx.strokeStyle='rgba(200,190,170,0.4)'; ctx.lineWidth=1;
      for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(sx+i*6,GROUND_Y-2); ctx.lineTo(sx+i*6+14,GROUND_Y-22); ctx.stroke(); }
      break;
  }
}

const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');
let renderScale = 1;

const BACKING_SCALE = 2; // fixed internal supersample factor; CSS size handles the actual fit
function resize(){
  const stageEl = $('stage');
  const cw = stageEl.clientWidth, ch = stageEl.clientHeight;
  renderScale = BACKING_SCALE;
  canvas.width = LW*BACKING_SCALE;
  canvas.height = LH*BACKING_SCALE;
  ctx.imageSmoothingEnabled = false;

  const gameAspect = LW/LH, boxAspect = cw/Math.max(1,ch);
  let cssW, cssH;
  if(boxAspect > gameAspect){ cssH = ch; cssW = ch*gameAspect; }
  else { cssW = cw; cssH = cw/gameAspect; }
  canvas.style.width = Math.floor(cssW)+'px';
  canvas.style.height = Math.floor(cssH)+'px';
}
let rotateDismissed = false;
function updateRotateOverlay(){
  const portrait = window.innerHeight > window.innerWidth;
  const shouldShow = portrait && !rotateDismissed && mode!=='title';
  $('rotateOverlay').classList.toggle('hidden', !shouldShow);
}

/* =====================================================================
   STAT / ACHIEVEMENT HELPERS
===================================================================== */
const statKeys = ['food','military','reputation','wealth'];
function clamp(v){ return Math.max(0, Math.min(100, v)); }

function renderStats(prev){
  statKeys.forEach(k=>{
    const v = clamp(state.stats[k]);
    $('fill'+cap(k)).style.width = v+'%';
    $('num'+cap(k)).textContent = Math.round(v);
  });
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function applyEffect(effect){
  if(!effect) return;
  let net = 0;
  statKeys.forEach(k=>{
    if(effect[k]){ net += effect[k]; state.stats[k] = clamp(state.stats[k] + effect[k]); }
  });
  renderStats();
  if(net > 0) AUDIO.sfx('statUp');
  else if(net < 0) AUDIO.sfx('statDown');
}

function showToast(text){
  const el = $('achToast');
  el.textContent = '🏆 '+text;
  el.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.add('hidden'), 2600);
}

function unlockAchievement(id){
  if(state.achievements[id]) return;
  state.achievements[id] = true;
  const all = [...ACHIEVEMENTS.endings, ...ACHIEVEMENTS.behaviors];
  const a = all.find(x=>x.id===id);
  if(a){ showToast('成就解鎖：'+a.icon+' '+a.name); AUDIO.sfx('achievement'); }
  saveStorage();
  renderAchievementLists();
}

function checkTalkerAchievement(){
  const totalNpcs = CHAPTERS.reduce((n,c)=>n+c.npcs.length,0);
  const talkedCount = Object.keys(state.talked).length;
  if(talkedCount >= totalNpcs) unlockAchievement('beh_talker');
}

function renderAchievementLists(){
  const build = (list, container)=>{
    container.innerHTML = '';
    list.forEach(a=>{
      const unlocked = !!state.achievements[a.id];
      const row = document.createElement('div');
      row.className = 'achRow'+(unlocked?'':' locked');
      row.innerHTML = `<div class="ic">${unlocked?a.icon:'❓'}</div>
        <div><div class="name pixel-font">${unlocked?a.name:'???'}</div><div class="desc">${unlocked?a.desc:'尚未解鎖'}</div></div>`;
      container.appendChild(row);
    });
  };
  build(ACHIEVEMENTS.endings, $('endingAchList'));
  build(ACHIEVEMENTS.behaviors, $('behaviorAchList'));
}

  const ch = CHAPTERS[index];

  }

function runEpilogue(){
  runNarration(EPILOGUE_PRE, '尾聲・東寧建制', showEnding);
}

function computeEnding(){
  const s = state.stats;
  const critical = statKeys.filter(k=>s[k] <= 30);
  if(critical.length >= 2) return ENDINGS.turmoil;
  if(critical.length === 0 && statKeys.every(k=>s[k] >= 65)) return ENDINGS.golden;
  if(critical.includes('food')) return ENDINGS.famine;
  if(critical.includes('military')) return ENDINGS.weak;
  if(critical.includes('reputation')) return ENDINGS.unrest;
  if(critical.includes('wealth')) return ENDINGS.poor;
  return ENDINGS.stable;
}

function showEnding(){
  const ending = computeEnding();
  $('endingEmoji').textContent = ending.emoji;
  $('endingTitle').textContent = ending.title;
  $('endingText').textContent = ending.text;

  const notes = [];
  if(state.flags.tactic_stealth) notes.push('鹿耳門奇襲的膽識，成為後世傳頌的奇謀。');
  else if(state.flags.tactic_assault) notes.push('熱蘭遮城下的強攻雖慘烈，卻也震懾了荷軍士氣。');
  if(state.flags.diplomacy_soft) notes.push('對新港社的懷柔政策，讓漢原關係得以緩和共存。');
  else if(state.flags.diplomacy_harsh) notes.push('鐵腕手段換來表面平靜，卻埋下日後衝突的種子。');
  if(state.flags.policy_tuntian) notes.push('屯田制奠定了台灣農業開發的基礎。');
  else if(state.flags.policy_levy) notes.push('強徵糧食解了燃眉之急，卻讓原漢矛盾更加尖銳。');
  $('endingNote').textContent = notes.join(' ');

  AUDIO.stopBgm();
  AUDIO.stopAmbience();
  AUDIO.sfx('ending');

  unlockAchievement(ending.id);
  unlockAchievement('beh_finish');
  checkTalkerAchievement();
  saveStorage();

  mode = 'ending';
  $('endingModal').classList.remove('hidden');
}

/* =====================================================================
   DIALOGUE ENGINE
===================================================================== */
const typer = { timer:null, full:'', idx:0, active:false, onDone:null };
const TYPE_SPEED = 36;   // ms per character — Chinese chars are whole words, so slower than a latin crawl
const BLIP_EVERY = 3;    // one blip per N characters, so it reads as speech rather than a buzz

function startTyping(text, onDone){
  stopTyping();
  typer.full = text;
  typer.idx = 0;
  typer.active = true;
  typer.onDone = onDone;
  $('dlgText').textContent = '';
  typer.timer = setInterval(()=>{
    typer.idx++;
    $('dlgText').textContent = typer.full.slice(0, typer.idx);
    const ch = typer.full.charAt(typer.idx-1);
    if(typer.idx % BLIP_EVERY === 0 && ch.trim() && !'，。！？、…—「」（）'.includes(ch)) AUDIO.sfx('blip');
    if(typer.idx >= typer.full.length) finishTyping();
  }, TYPE_SPEED);
}
function stopTyping(){
  if(typer.timer){ clearInterval(typer.timer); typer.timer = null; }
  typer.active = false;
}
function finishTyping(){
  if(!typer.active) return;
  stopTyping();
  $('dlgText').textContent = typer.full;
  const fn = typer.onDone; typer.onDone = null;
  if(fn) fn();
}

function openDialogue(npc){
  mode = 'dialogue';
  activeDialogue = { defId: npc.dialogue, nodeId: DIALOGUES[npc.dialogue].start, npc };
  $('dialoguePanel').classList.remove('hidden');
  AUDIO.sfx('talk');
  renderDialogueNode();
}

function currentNode(){
  return DIALOGUES[activeDialogue.defId].nodes[activeDialogue.nodeId];
}

function renderDialogueNode(){
  const node = currentNode();
  const sprite = P[node.sprite] || P.koxinga;
  drawPortrait($('dlgPortrait'), sprite);
  $('dlgName').textContent = node.speaker;
  $('dlgRole').textContent = node.role || '';

  if(node.effect) applyEffect(node.effect);

  const choicesEl = $('dlgChoices');
  const footerEl = $('dlgFooter');
  choicesEl.classList.add('hidden');
  footerEl.classList.add('hidden');

  startTyping(node.text, ()=>{
    if(node.choices){
      choicesEl.classList.remove('hidden');
      choicesEl.innerHTML = '';
      node.choices.forEach(choice=>{
        const btn = document.createElement('button');
        btn.className = 'choiceBtn';
        let html = choice.label;
        if(dev.godMode && choice.effect){
          const labels = {food:'糧食',military:'兵力',reputation:'聲望',wealth:'國庫'};
          const parts = statKeys.filter(k=>choice.effect[k]).map(k=>labels[k]+(choice.effect[k]>0?'+':'')+choice.effect[k]);
          if(parts.length) html += `<span class="choiceImpact">${parts.join(' ')}</span>`;
        }
        btn.innerHTML = html;
        btn.addEventListener('click', ()=>{
          AUDIO.sfx('select');
          if(choice.effect) applyEffect(choice.effect);
          if(choice.flag) state.flags[choice.flag] = true;
          activeDialogue.nodeId = choice.next;
          renderDialogueNode();
        });
        choicesEl.appendChild(btn);
      });
    } else {
      footerEl.classList.remove('hidden');
    }
  });
}

function advanceDialogue(){
  if(typer.active){ finishTyping(); return; }
  const node = currentNode();
  if(node.choices) return; // must click a choice button
  if(node.next === null || node.next === undefined){
    closeDialogue();
  } else {
    activeDialogue.nodeId = node.next;
    renderDialogueNode();
  }
}

function closeDialogue(){
  stopTyping();
  state.talked[activeDialogue.npc.id] = true;
  checkTalkerAchievement();
  saveStorage();
  activeDialogue = null;
  $('dialoguePanel').classList.add('hidden');
  mode = 'walking';
}

window.addEventListener('keydown', e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = true;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = true;
  if(e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E'){
    e.preventDefault();
    handleInteractKey();
  }
});
window.addEventListener('keyup', e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) keys.left = false;
  if(['ArrowRight','d','D'].includes(e.key)) keys.right = false;
});

function bindHold(el, onDown, onUp){
  el.addEventListener('pointerdown', e=>{ e.preventDefault(); onDown(); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev, onUp));
}
bindHold($('btnLeft'), ()=>keys.left=true, ()=>keys.left=false);
bindHold($('btnRight'), ()=>keys.right=true, ()=>keys.right=false);
$('btnInteract').addEventListener('pointerdown', e=>{ e.preventDefault(); handleInteractKey(); });

function handleInteractKey(){
  if(mode === 'narration'){ advanceNarration(); return; }
  if(mode === 'dialogue'){ advanceDialogue(); return; }
  if(mode === 'walking'){
    const ch = CHAPTERS[state.chapterIndex];
    const near = ch.npcs.find(n=>Math.abs(n.x - player.x) < INTERACT_RANGE);
    if(near) openDialogue(near);
  }
}

$('narrationScreen').addEventListener('click', ()=>{ if(mode==='narration') advanceNarration(); });
$('dlgContinue').addEventListener('click', (e)=>{ e.stopPropagation(); if(mode==='dialogue') advanceDialogue(); });
$('dialoguePanel').addEventListener('click', (e)=>{
  if(mode !== 'dialogue') return;
  if(e.target.closest('.choiceBtn')) return; // the button's own handler takes it
  advanceDialogue();
});

/* =====================================================================
   MAIN LOOP
===================================================================== */
function update(dt){
  clock += dt;
  if(mode !== 'walking') return;

  const ch = CHAPTERS[state.chapterIndex];
  player.vx = 0;
  if(keys.left){ player.vx = -SPEED; player.facing = -1; }
  if(keys.right){ player.vx = SPEED; player.facing = 1; }
  player.walking = player.vx !== 0;
  player.x = Math.max(20, Math.min(ch.width-20, player.x + player.vx*dt));

  // footstep on each stride of the walk cycle (matches the sprite's leg swap)
  if(player.walking){
    const phase = Math.sin(clock*10);
    if(phase >= 0 !== player._lastPhase){
      player._lastPhase = phase >= 0;
      AUDIO.sfx('step');
    }
  }

  cam = Math.max(0, Math.min(Math.max(0, ch.width-LW), player.x - LW/2));

  const near = ch.npcs.find(n=>Math.abs(n.x - player.x) < INTERACT_RANGE);
  if(near) showPromptToast('按 空白／互動鈕 與「'+near.name+'」對話');

  if(player.x >= ch.width - 30){
    const allTalked = ch.npcs.every(n=>state.talked[n.id]);
    if(allTalked){
      enterChapter(state.chapterIndex+1);
    } else {
      player.x = ch.width - 30;
      showPromptToast('先跟大家聊聊吧……');
    }
  }
}

function render(){
  ctx.save();
  ctx.scale(renderScale, renderScale);
  ctx.clearRect(0,0,LW,LH);

  if(mode === 'walking' || mode === 'dialogue'){
    const ch = CHAPTERS[state.chapterIndex];
    drawBackground(ctx, ch.theme, cam, ch.width);
    ch.props.forEach(p=> drawProp(ctx, p.x - cam, p.type));

    const SPRITE_CLEARANCE = 28;
    let playerDrawX = player.x;
    ch.npcs.forEach(n=>{
      if(Math.abs(playerDrawX - n.x) < SPRITE_CLEARANCE){
        playerDrawX = playerDrawX >= n.x ? n.x + SPRITE_CLEARANCE : n.x - SPRITE_CLEARANCE;
      }
    });
    const entities = ch.npcs.map(n=>({x:n.x, draw:()=>drawHumanoid(ctx, n.x-cam, GROUND_Y, P[n.sprite]||P.koxinga, -1, false, clock)}));
    entities.push({x:playerDrawX, draw:()=>drawHumanoid(ctx, playerDrawX-cam, GROUND_Y, P.koxinga, player.facing, player.walking, clock)});
    entities.sort((a,b)=>a.x-b.x).forEach(e=>e.draw());

    ch.npcs.forEach(n=>{
      const sx = n.x - cam;
      if(sx > -30 && sx < LW+30){
        ctx.fillStyle = state.talked[n.id] ? 'rgba(232,196,104,0.5)' : '#e8c468';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        if(Math.abs(n.x-player.x) < INTERACT_RANGE+10){
          ctx.fillText('▲', sx, GROUND_Y-72);
        } else if(!state.talked[n.id]){
          ctx.fillText('!', sx, GROUND_Y-74);
        }
      }
    });
  } else {
    ctx.fillStyle = '#0a0d18';
    ctx.fillRect(0,0,LW,LH);
  }

  ctx.restore();
}

function loop(ts){
  if(!lastTime) lastTime = ts;
  const dt = Math.min(0.05, (ts-lastTime)/1000);
  lastTime = ts;
  update(dt);
  render();
  updateRotateOverlay();
  requestAnimationFrame(loop);
}

/* =====================================================================
   TITLE / MENU BINDINGS
===================================================================== */
$('btnNewGame').addEventListener('click', startNewGame);
$('btnContinue').addEventListener('click', continueGame);
$('btnTitleAchievements').addEventListener('click', ()=>{
  if(!state) state = freshState();
  renderAchievementLists();
  $('achievementModal').classList.remove('hidden');
});
$('closeAch').addEventListener('click', ()=> $('achievementModal').classList.add('hidden'));

$('endingRestartBtn').addEventListener('click', ()=>{
  $('endingModal').classList.add('hidden');
  goTitle();
});

/* ---------- hidden dev menu ---------- */
let titleClicks = 0, titleClickTimer = null;
function registerSecretTap(){
  titleClicks++;
  clearTimeout(titleClickTimer);
  titleClickTimer = setTimeout(()=>titleClicks=0, 1500);
  if(titleClicks >= 5){
    titleClicks = 0;
    if(!state) state = freshState();
    $('devMenu').classList.remove('hidden');
  }
}
$('gameTitleClicker').addEventListener('click', registerSecretTap);
$('hudChapterTitle').addEventListener('click', registerSecretTap);
$('closeDevMenu').addEventListener('click', ()=> $('devMenu').classList.add('hidden'));
$('godModeToggle').addEventListener('click', ()=>{
  dev.godMode = !dev.godMode;
  $('godModeToggle').classList.toggle('on', dev.godMode);
  $('cheatBanner').classList.toggle('hidden', !dev.godMode);
  if(mode==='dialogue') renderDialogueNode();
});
$('maxStatsBtn').addEventListener('click', ()=>{
  if(!state) state = freshState();
  statKeys.forEach(k=>state.stats[k]=80);
  renderStats();
});
$('unlockAllBtn').addEventListener('click', ()=>{
  if(!state) state = freshState();
  [...ACHIEVEMENTS.endings, ...ACHIEVEMENTS.behaviors].forEach(a=>state.achievements[a.id]=true);
  saveStorage();
  renderAchievementLists();
});
$('skipChapterBtn').addEventListener('click', ()=>{
  if(!state || mode==='title') return;
  if(mode==='dialogue') closeDialogue();
  enterChapter(state.chapterIndex+1);
});

$('dismissRotate').addEventListener('click', ()=>{
  rotateDismissed = true;
  $('rotateOverlay').classList.add('hidden');
});

/* =====================================================================
   AUDIO CONTROLS
===================================================================== */
function anyAudioOn(){ return AUDIO.enabled.bgm || AUDIO.enabled.sfx; }
function refreshAudioUI(){
  $('btnMute').textContent = anyAudioOn() ? '🔊' : '🔇';
  $('tglBgm').classList.toggle('on', AUDIO.enabled.bgm);
  $('tglSfx').classList.toggle('on', AUDIO.enabled.sfx);
}
$('btnMute').addEventListener('click', (e)=>{
  e.stopPropagation();
  const on = !anyAudioOn();
  AUDIO.setEnabled('bgm', on);
  AUDIO.setEnabled('sfx', on);
  refreshAudioUI();
});
$('tglBgm').addEventListener('click', ()=>{
  AUDIO.setEnabled('bgm', !AUDIO.enabled.bgm);
  refreshAudioUI();
});
$('tglSfx').addEventListener('click', ()=>{
  AUDIO.setEnabled('sfx', !AUDIO.enabled.sfx);
  refreshAudioUI();
  AUDIO.sfx('confirm');
});

// Browsers block audio until a user gesture; unlock on the first one.
function firstGestureUnlock(){
  AUDIO.unlock();
  if(mode === 'title') AUDIO.playBgm('title');
  document.removeEventListener('pointerdown', firstGestureUnlock);
  document.removeEventListener('keydown', firstGestureUnlock);
}
document.addEventListener('pointerdown', firstGestureUnlock);
document.addEventListener('keydown', firstGestureUnlock);

document.addEventListener('visibilitychange', ()=>{
  if(!AUDIO.ready) return;
  if(document.hidden) AUDIO.ctx.suspend();
  else AUDIO.ctx.resume();
});

/* =====================================================================
   INIT
===================================================================== */
AUDIO.loadPrefs();
refreshAudioUI();
state = freshState();
renderStats();
renderAchievementLists();
goTitle();
resize();
requestAnimationFrame(loop);

})();
</script>
