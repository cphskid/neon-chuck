<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>星夜騎行</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1430;color:#f3d98a;font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  canvas#c:active{cursor:grabbing}
  #hud{position:fixed;left:12px;top:12px;padding:10px 12px;background:rgba(10,20,52,.62);border:1px solid rgba(243,217,138,.35);border-radius:10px;font-size:13px;line-height:1.5;max-width:260px;user-select:none;backdrop-filter:blur(3px)}
  #hud h1{margin:0 0 4px;font-size:16px;letter-spacing:.12em;color:#ffd977}
  #hud .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  #hud button{font:inherit;font-size:12px;color:#ffe6a6;background:rgba(40,70,140,.55);border:1px solid rgba(243,217,138,.45);border-radius:6px;padding:4px 8px;cursor:pointer}
  #hud button.on{background:rgba(214,150,40,.55);color:#fff4d0}
  #stats{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#b9c9ee;white-space:pre}
  #help{display:none;margin-top:6px;font-size:12px;color:#dfe6ff}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1430;z-index:10;font-size:18px;letter-spacing:.2em}
  #loading small{margin-top:10px;font-size:12px;color:#9fb0dd;letter-spacing:.05em}
  #joy{position:fixed;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;background:rgba(20,40,90,.35);border:2px solid rgba(243,217,138,.45);display:none;touch-action:none;z-index:5}
  #knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(243,217,138,.6);box-shadow:0 0 12px rgba(255,200,90,.6)}
  #jumpBtn{position:fixed;right:26px;bottom:34px;width:88px;height:88px;border-radius:50%;font:inherit;font-size:22px;color:#fff3c8;background:rgba(200,130,40,.5);border:2px solid rgba(255,225,150,.7);display:none;touch-action:none;z-index:5}
  body.touch #joy,body.touch #jumpBtn{display:block}
  body.touch #hud{font-size:11px;max-width:200px;padding:6px 8px;left:8px;top:8px}
  body.touch #hud h1{font-size:13px}
  body.touch #hud button{font-size:11px;padding:3px 6px}
  body.touch #stats{font-size:10px}
  body.tour #joy,body.tour #jumpBtn{opacity:.25}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0b1430;z-index:20}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>星夜騎行</h1>
  <div id="stats">載入中…</div>
  <div class="row">
    <button id="bAuto" class="on" title="P">自動騎行</button>
    <button id="bTour" title="T">全景巡遊</button>
    <button id="bHelp">操作說明</button>
  </div>
  <div id="help"></div>
</div>
<div id="joy"><div id="knob"></div></div>
<button id="jumpBtn">跳</button>
<div id="loading">調 色 中<small id="loadMsg">準備畫布…</small></div>
<div id="err"></div>

<script type="module">
// =====================================================================
//  星夜騎行 — the whole frame is painted with instanced oil-paint strokes.
//  Every stroke is a quad fixed in 3D (position + tangent + normal),
//  shaded per stroke with a bright/dark pigment pair and painted in the
//  fragment shader with a fixed number of bristles and impasto lighting.
// =====================================================================
const RAPIER_URLS = [
  'https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js',
  'https://esm.sh/@dimforge/rapier3d-compat@0.14.0',
];
const params = new URLSearchParams(location.search);
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
if (IS_TOUCH) document.body.classList.add('touch');
const Q = params.has('q') ? Math.max(0.05, +params.get('q')) : (IS_TOUCH ? 0.45 : 1.0);   // stroke density
const FIXED_RES = params.has('fixedres');
const $ = id => document.getElementById(id);
const loadMsg = t => { $('loadMsg').textContent = t; };
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

// ---------------------------------------------------------------- math
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
function sstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(20261120);
const rr = (a, b) => a + (b - a) * rnd();
const v3 = (x, y, z) => [x, y, z];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const scl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const len = a => Math.hypot(a[0], a[1], a[2]);
const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
function onPlane(t, n) { let p = sub(t, scl(n, dot(t, n))); if (len(p) < 1e-4) p = cross(n, Math.abs(n[1]) < .9 ? [0, 1, 0] : [1, 0, 0]); return norm(p); }
function dirAE(azDeg, elDeg) { const a = azDeg * Math.PI / 180, e = elDeg * Math.PI / 180; return [Math.cos(a) * Math.cos(e), Math.sin(e), Math.sin(a) * Math.cos(e)]; }

const M4 = {
  id() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3]; return o; },
  T(x, y, z) { const m = M4.id(); m[12] = x; m[13] = y; m[14] = z; return m; },
  Rx(a) { const m = M4.id(), c = Math.cos(a), s = Math.sin(a); m[5] = c; m[6] = s; m[9] = -s; m[10] = c; return m; },
  Ry(a) { const m = M4.id(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[2] = -s; m[8] = s; m[10] = c; return m; },
  Rz(a) { const m = M4.id(), c = Math.cos(a), s = Math.sin(a); m[0] = c; m[1] = s; m[4] = -s; m[5] = c; return m; },
  chain(...ms) { return ms.reduce((a, b) => M4.mul(a, b)); },
  persp(fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2), m = new Float32Array(16); m[0] = t / asp; m[5] = t; m[10] = (f + n) / (n - f); m[11] = -1; m[14] = 2 * f * n / (n - f); return m; },
  lookAt(e, c, up) { const z = norm(sub(e, c)), x = norm(cross(up, z)), y = cross(z, x); const m = M4.id(); m[0] = x[0]; m[4] = x[1]; m[8] = x[2]; m[1] = y[0]; m[5] = y[1]; m[9] = y[2]; m[2] = z[0]; m[6] = z[1]; m[10] = z[2]; m[12] = -dot(x, e); m[13] = -dot(y, e); m[14] = -dot(z, e); return m; },
  apply(m, p) { return [m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13], m[2] * p[0] + m[6] * p[1] + m[10] * p[2] + m[14]]; },
};
// Ry convention: (0,0,1) -> (sin a, 0, cos a)

// ------------------------------------------------- terrain (JS == GLSL)
function hash2(ix, iz) { let h = (Math.imul(ix | 0, 374761393) + Math.imul(iz | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h & 0xffffff) / 16777216; }
function vnoise(x, z) { const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz; const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz); const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1); return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz; }
const RING_R = 70;
const VC = [-170, 160];               // village centre
const WM = [150, -35];                // windmill
const CLIFF_X = -229;
function riverZ(x) { return -150 + 18 * Math.sin(x / 70) + 6 * Math.sin(x / 23 + 1.0); }
function riverDZ(x) { return 18 / 70 * Math.cos(x / 70) + 6 / 23 * Math.cos(x / 23 + 1.0); }
function hills(x, z) {
  let h = (vnoise(x * 0.006 + 3.1, z * 0.006 + 7.7) - 0.5) * 18 + (vnoise(x * 0.021 + 1.3, z * 0.021 + 9.2) - 0.5) * 5 + (vnoise(x * 0.08, z * 0.08) - 0.5) * 0.9;
  const r = Math.hypot(x, z);
  h *= 1 - 0.7 * sstep(130, 60, r);
  h += 22 * sstep(-226, -232, x);
  return h;
}
function H(x, z) {
  let h = hills(x, z);
  const d = Math.abs(z - riverZ(x));
  if (d < 30) { const bank = hills(x, riverZ(x)); h = h + (bank - h) * sstep(30, 12, d) - 2.6 * sstep(9, 3, d); }
  return h;
}
const waterLevel = x => hills(x, riverZ(x)) - 0.9;
function terrainNormal(x, z) { const e = 0.5; return norm([-(H(x + e, z) - H(x - e, z)) / (2 * e), 1, -(H(x, z + e) - H(x, z - e)) / (2 * e)]); }
const ROADS = [ // segments [x0,z0,x1,z1]
  [0, -RING_R, 0, -330],
  [-49.5, 49.5, -95, 92], [-95, 92, -170, 150],
  [RING_R, 0, 112, -14], [112, -14, 142, -30],
];
function segDist(x, z, s) { const dx = s[2] - s[0], dz = s[3] - s[1]; const t = clamp(((x - s[0]) * dx + (z - s[1]) * dz) / (dx * dx + dz * dz), 0, 1); return Math.hypot(x - s[0] - dx * t, z - s[1] - dz * t); }
function roadDist(x, z) { let d = 1e9, best = null; for (const s of ROADS) { const q = segDist(x, z, s); if (q < d) { d = q; best = s; } } return [d, best]; }
const WHEAT = [[95, 230, 30, 180], [-140, -70, -125, -72]];
const inRect = (x, z, r) => x > r[0] && x < r[1] && z > r[2] && z < r[3];
const BRIDGE_Z = riverZ(0);
const BRIDGE_BANK = hills(0, BRIDGE_Z);
function deckY(z) { const u = (z - BRIDGE_Z) / 11; return Math.abs(u) > 1 ? -1e9 : BRIDGE_BANK + 0.05 + 2.8 * (1 - u * u); }

// ---------------------------------------------------------- palettes
const P = (b, d) => ({ b, d });
const PAL = {
  meadow: P([0.42, 0.6, 0.3], [0.07, 0.16, 0.13]), meadow2: P([0.58, 0.64, 0.3], [0.1, 0.18, 0.1]),
  path: P([0.74, 0.62, 0.42], [0.27, 0.22, 0.2]), soil: P([0.34, 0.44, 0.2], [0.07, 0.11, 0.07]),
  wheatG: P([0.93, 0.77, 0.32], [0.38, 0.28, 0.11]), bank: P([0.48, 0.42, 0.3], [0.13, 0.12, 0.14]),
  rock: P([0.64, 0.6, 0.56], [0.15, 0.15, 0.22]), rock2: P([0.5, 0.52, 0.58], [0.1, 0.11, 0.18]), village: P([0.72, 0.63, 0.47], [0.24, 0.21, 0.21]),
  wood: P([0.62, 0.43, 0.25], [0.18, 0.11, 0.07]), stone: P([0.7, 0.67, 0.6], [0.2, 0.2, 0.26]),
  plaster: P([0.9, 0.84, 0.64], [0.28, 0.28, 0.36]), plaster2: P([0.66, 0.74, 0.82], [0.17, 0.2, 0.3]), plaster3: P([0.88, 0.7, 0.5], [0.3, 0.22, 0.24]),
  roofBlue: P([0.36, 0.44, 0.62], [0.06, 0.08, 0.15]), roofRed: P([0.78, 0.42, 0.24], [0.24, 0.11, 0.1]), roofDark: P([0.3, 0.3, 0.4], [0.05, 0.05, 0.09]),
  window: P([1.0, 0.82, 0.38], [0.95, 0.55, 0.16]), door: P([0.42, 0.26, 0.15], [0.1, 0.06, 0.05]),
  cypress: P([0.22, 0.4, 0.3], [0.02, 0.06, 0.05]), cypress2: P([0.27, 0.45, 0.5], [0.03, 0.07, 0.09]),
  olive: P([0.48, 0.58, 0.42], [0.07, 0.13, 0.11]), trunk: P([0.4, 0.3, 0.22], [0.08, 0.06, 0.06]),
  stem: P([0.36, 0.56, 0.25], [0.07, 0.14, 0.07]), leaf: P([0.3, 0.52, 0.22], [0.05, 0.11, 0.06]),
  petal: P([1.0, 0.82, 0.22], [0.78, 0.46, 0.08]), seedC: P([0.46, 0.26, 0.08], [0.11, 0.05, 0.03]),
  wheat: P([0.96, 0.8, 0.36], [0.42, 0.31, 0.12]), wheat2: P([0.99, 0.88, 0.5], [0.5, 0.38, 0.15]),
  water: P([0.35, 0.55, 0.75], [0.05, 0.1, 0.24]), fall: P([0.85, 0.92, 1.0], [0.3, 0.42, 0.6]),
  horse: P([0.62, 0.36, 0.19], [0.2, 0.1, 0.06]), horseDark: P([0.25, 0.15, 0.1], [0.06, 0.04, 0.03]),
  saddle: P([0.5, 0.22, 0.14], [0.13, 0.05, 0.04]), blanket: P([0.75, 0.2, 0.15], [0.25, 0.05, 0.06]),
  cape: P([0.26, 0.46, 1.0], [0.08, 0.15, 0.45]), tunic: P([0.35, 0.5, 0.82], [0.07, 0.1, 0.25]),
  skin: P([0.92, 0.7, 0.52], [0.35, 0.22, 0.18]), hat: P([0.32, 0.26, 0.36], [0.06, 0.05, 0.08]),
  boot: P([0.3, 0.2, 0.14], [0.06, 0.04, 0.03]), lantern: P([1.0, 0.86, 0.45], [1.0, 0.6, 0.2]), metal: P([0.4, 0.38, 0.35], [0.08, 0.08, 0.1]),
};

// --------------------------------------------------- stroke buffers
// layout (36 bytes): pos f32x3 | half-size f32x2 (w,l) | tangent i8x4 (w=sway) | normal i8x4 (w=ao) | bright u8x4 (a=seed) | dark u8x4 (a=material)
const STRIDE = 36;
const MAT = { STD: 0, SWAY: 1, EMIT: 2, WATER: 3, MIRROR: 4, CLOTH: 5, FALL: 6, FOLIAGE: 7, SKYFLOW: 10, SKYFIX: 11, SKYEMIT: 12 };
class StrokeSet {
  constructor(cap = 1024) { this.n = 0; this.alloc(cap); }
  alloc(cap) { const old = this.u8c; this.cap = cap; this.buf = new ArrayBuffer(cap * STRIDE); this.f = new Float32Array(this.buf); this.i8 = new Int8Array(this.buf); this.u8c = new Uint8ClampedArray(this.buf); if (old) this.u8c.set(old.subarray(0, this.n * STRIDE)); }
  push(p, t, n, hw, hl, pal, mat = 0, tw = 0, ao = 1, jit = 0.06) {
    if (this.n >= this.cap) this.alloc(this.cap * 2);
    const i = this.n++, f = i * 9, b = i * STRIDE;
    this.f[f] = p[0]; this.f[f + 1] = p[1]; this.f[f + 2] = p[2]; this.f[f + 3] = hw; this.f[f + 4] = hl;
    const i8 = this.i8, u = this.u8c;
    i8[b + 20] = Math.round(t[0] * 127); i8[b + 21] = Math.round(t[1] * 127); i8[b + 22] = Math.round(t[2] * 127); i8[b + 23] = Math.round(clamp(tw, -1, 1) * 127);
    i8[b + 24] = Math.round(n[0] * 127); i8[b + 25] = Math.round(n[1] * 127); i8[b + 26] = Math.round(n[2] * 127); i8[b + 27] = Math.round(clamp(ao, 0, 1) * 127);
    const k = 1 + (rnd() - 0.5) * jit * 2;
    u[b + 28] = pal.b[0] * k * 255; u[b + 29] = pal.b[1] * k * 255; u[b + 30] = pal.b[2] * k * 255; u[b + 31] = rnd() * 255;
    u[b + 32] = pal.d[0] * k * 255; u[b + 33] = pal.d[1] * k * 255; u[b + 34] = pal.d[2] * k * 255; u[b + 35] = mat;
  }
}
// World sets are chunked (40 m cells), shuffled inside each cell so that drawing the first N
// instances of a chunk is an unbiased thinning — that is how distant chunks get fewer strokes.
const CELL = 40;
class ChunkedSet extends StrokeSet {
  finalize() {
    const n = this.n, f = this.f, keyOf = new Int32Array(n), counts = new Int32Array(4096);
    for (let i = 0; i < n; i++) { const cx = clamp(Math.floor(f[i * 9] / CELL) + 32, 0, 63), cz = clamp(Math.floor(f[i * 9 + 2] / CELL) + 32, 0, 63); const k = cx * 64 + cz; keyOf[i] = k; counts[k]++; }
    const start = new Int32Array(4097); for (let k = 0; k < 4096; k++) start[k + 1] = start[k] + counts[k];
    const fill = start.slice(0, 4096), perm = new Uint32Array(n);
    for (let i = 0; i < n; i++) perm[fill[keyOf[i]]++] = i;
    const src = new Uint32Array(this.buf, 0, n * 9), out = new ArrayBuffer(n * STRIDE), dst = new Uint32Array(out);
    const r = mulberry(7);
    this.chunks = [];
    for (let k = 0; k < 4096; k++) {
      const s = start[k], c = counts[k]; if (!c) continue;
      for (let j = c - 1; j > 0; j--) { const q = Math.floor(r() * (j + 1)); const t = perm[s + j]; perm[s + j] = perm[s + q]; perm[s + q] = t; }
      const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9]; let maxL = 0;
      for (let j = 0; j < c; j++) {
        const i = perm[s + j], o = (s + j) * 9, si = i * 9;
        for (let w = 0; w < 9; w++) dst[o + w] = src[si + w];
        for (let a = 0; a < 3; a++) { const v = f[si + a]; if (v < mn[a]) mn[a] = v; if (v > mx[a]) mx[a] = v; }
        if (f[si + 4] > maxL) maxL = f[si + 4];
      }
      this.chunks.push({ start: s, count: c, mn, mx, maxL });
    }
    this.buf = out; this.cap = n;
  }
}

// ---------------------------------------------------------------- GL
const canvas = $('c');
const gl = canvas.getContext('webgl2', { antialias: !IS_TOUCH, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: params.has('shot') });
if (!gl) { $('err').style.display = 'flex'; $('err').textContent = '此瀏覽器不支援 WebGL2，無法繪製。'; $('loading').style.display = 'none'; throw new Error('no webgl2'); }
const HAS_AA = !!gl.getContextAttributes().antialias && gl.getParameter(gl.SAMPLES) > 0;

const GLSL_COMMON = `#version 300 es
precision highp float; precision highp int;
uniform mat4 uVP; uniform vec3 uCam; uniform float uTime; uniform vec2 uRes; uniform float uProjY;
uniform float uPxMin, uPxMax, uPxLod;
uniform vec3 uMoonDir, uMoonTint, uFogCol, uMoonSky; uniform float uFogD;
uniform vec4 uLP[8]; uniform vec4 uLC[8];
uniform vec4 uVort[6]; uniform float uVortS[6];
float h11(float n){ return fract(sin(n*12.9898+4.1414)*43758.5453); }
float sstep(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.0,1.0); return t*t*(3.0-2.0*t); }
float hashI(int ix,int iz){ uint h=uint(ix)*374761393u+uint(iz)*668265263u; h=(h^(h>>13u))*1274126177u; h^=h>>16u; return float(h&0xffffffu)/16777216.0; }
float vnoise(vec2 p){ vec2 i=floor(p); vec2 f=p-i; vec2 u=f*f*(3.0-2.0*f); int ix=int(i.x), iz=int(i.y);
  float a=hashI(ix,iz), b=hashI(ix+1,iz), c=hashI(ix,iz+1), d=hashI(ix+1,iz+1); return a+(b-a)*u.x+(c-a)*u.y+(a-b-c+d)*u.x*u.y; }
float riverZ(float x){ return -150.0+18.0*sin(x/70.0)+6.0*sin(x/23.0+1.0); }
float hills(float x,float z){
  float h=(vnoise(vec2(x*0.006+3.1,z*0.006+7.7))-0.5)*18.0+(vnoise(vec2(x*0.021+1.3,z*0.021+9.2))-0.5)*5.0+(vnoise(vec2(x*0.08,z*0.08))-0.5)*0.9;

const VORT = [[40, 30, 0.34, 1.0], [72, 22, 0.2, 0.8], [-24, 36, 0.22, -0.9], [180, 32, 0.4, 1.0], [112, 55, 0.45, -0.6], [-100, 26, 0.3, 0.8]];
const VORT_DIR = VORT.map(v => dirAE(v[0], v[1]));
const MOON_DIR = dirAE(10, 16);
function genSky() {
  const COB = [0.13, 0.28, 0.68], ULT = [0.09, 0.12, 0.47], TEAL = [0.16, 0.5, 0.56], PALE = [0.62, 0.78, 0.88], WH = [0.82, 0.9, 0.96], YG = [0.78, 0.82, 0.5];
  const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const cnt = Math.round(62000 * Math.max(Q, 0.6));
  for (let i = 0; i < cnt; i++) {
    let d; do { d = norm([rnd() * 2 - 1, rnd() * 2 - 1, rnd() * 2 - 1]); } while (d[1] < -0.12);
    const el = Math.max(d[1], 0);
    let sw = 0;
    VORT.forEach((v, k) => {
      const c = VORT_DIR[k], a = Math.acos(clamp(dot(d, c), -1, 1)), f = Math.exp(-(a * a) / (v[2] * v[2]));
      const e1 = norm(cross(c, [0, 1, 0])), e2 = cross(e1, c), th = Math.atan2(dot(d, e2), dot(d, e1));
      sw += f * (0.5 + 0.5 * Math.sin(th * 2 + a / v[2] * 9));
    });
    sw += 0.35 * Math.max(0, Math.sin(Math.atan2(d[2], d[0]) * 2 + el * 7)) * Math.exp(-Math.pow((el - 0.45) / 0.15, 2));  // a luminous band
    const r = rnd();
    let c = r < 0.38 ? COB : r < 0.68 ? ULT : r < 0.88 ? TEAL : PALE;
    if (el < 0.18 && rnd() < 0.5) c = mix3(TEAL, PALE, rnd() * .5);
    c = mix3(c, rnd() < 0.5 ? PALE : WH, clamp(sw, 0, 1) * 0.65);
    const md = Math.acos(clamp(dot(d, MOON_DIR), -1, 1));
    c = mix3(c, YG, Math.exp(-Math.pow(md / 0.4, 2)) * 0.55);
    c = mix3(c, ULT, (1 - Math.min(1, el * 3)) * 0 + Math.max(0, el - 0.7) * 0.8);
    SKY.push(d, [1, 0, 0], scl(d, -1), rr(0.0042, 0.0068), rr(0.013, 0.03), P(scl(c, 1.12), scl(c, 0.78)), MAT.SKYFLOW, 0, 1, 0);
  }
  const ringStrokes = (center, rad, w, l, pal, mat, density = 1) => {
    const e1 = norm(cross(center, [0, 1, 0])), e2 = cross(e1, center);
    const n = Math.max(8, Math.round(2 * Math.PI * rad / (l * 1.2) * density));
    for (let k = 0; k < n; k++) {
      const a = k / n * 6.283 + rnd() * 0.05, rj = rad * (1 + (rnd() - .5) * 0.06);
      const off = add(scl(e1, Math.cos(a) * rj), scl(e2, Math.sin(a) * rj));

    }
  };
  const radial = (center, r0, r1, n, w, l, pal, mat) => {
    const e1 = norm(cross(center, [0, 1, 0])), e2 = cross(e1, center);
    for (let k = 0; k < n; k++) {
      const a = rnd() * 6.283, r = lerp(r0, r1, Math.sqrt(rnd())), dir2 = add(scl(e1, Math.cos(a)), scl(e2, Math.sin(a)));

  const halo = [[0.27, P([0.6, 0.75, 0.62], [0.35, 0.5, 0.55])], [0.22, P([0.85, 0.85, 0.5], [0.55, 0.6, 0.45])], [0.175, P([0.98, 0.82, 0.42], [0.75, 0.6, 0.3])], [0.135, P([1.0, 0.9, 0.55], [0.85, 0.68, 0.32])], [0.1, P([1.0, 0.78, 0.35], [0.92, 0.55, 0.2])]];
  for (const [r, pal] of halo) for (let rep = 0; rep < 3; rep++) ringStrokes(MOON_DIR, r + (rep - 1) * 0.008, 0.007, 0.022, pal, MAT.SKYEMIT);
  // moon disc: swirling gold-orange strokes
  ringStrokes(MOON_DIR, 0.068, 0.008, 0.02, P([1.0, 0.72, 0.25], [0.95, 0.5, 0.12]), MAT.SKYEMIT, 1.4);
  for (let rad = 0.058; rad > 0.005; rad -= 0.009) ringStrokes(MOON_DIR, rad, 0.008, 0.018, P([1.0, 0.8, 0.32], [1.0, 0.62, 0.18]), MAT.SKYEMIT, 1.3);
  radial(MOON_DIR, 0, 0.03, 30, 0.008, 0.014, P([1.0, 0.9, 0.55], [1.0, 0.7, 0.3]), MAT.SKYEMIT);
  // stars with radiating rays and halos
  const STARS = [[55, 48], [85, 40], [18, 46], [-12, 30], [-42, 42], [100, 25], [132, 45], [160, 34], [-70, 22], [-122, 40], [205, 50], [252, 30], [300, 40], [28, 64], [62, 28], [-5, 58], [235, 62], [140, 70]];
  for (const [az, el] of STARS) {
    const c = dirAE(az, el), s = rr(0.8, 1.25);
    ringStrokes(c, 0.05 * s, 0.006, 0.017, P([0.75, 0.85, 0.6], [0.45, 0.6, 0.6]), MAT.SKYEMIT, 0.9);

  }
  for (let i = 0; i < 260; i++) { let d; do { d = norm([rnd() * 2 - 1, rnd(), rnd() * 2 - 1]); } while (d[1] < 0.12); const t = norm(cross(d, [0, 1, 0])); SKY.push(d, t, scl(d, -1), 0.0025, 0.006, P([1, 0.95, 0.7], [0.9, 0.8, 0.5]), MAT.SKYEMIT); SKY.push(d, cross(d, t), scl(d, -1), 0.0025, 0.006, P([1, 0.95, 0.7], [0.9, 0.8, 0.5]), MAT.SKYEMIT); }
}

function ellip(set, c, r, cnt, pal, opts = {}) {
  const along = opts.along || [0, 0, 1], mat = opts.mat || 0;
  for (let i = 0; i < cnt; i++) {
    const u = rnd() * 2 - 1, a = rnd() * 6.283, s = Math.sqrt(1 - u * u), d = [s * Math.cos(a), u, s * Math.sin(a)];
    if (opts.filter && !opts.filter(d)) continue;

    if (opts.xf) p = opts.xf(p);
    let n = norm([d[0] / r[0], d[1] / r[1], d[2] / r[2]]); if (opts.xfn) n = opts.xfn(n);
    const t = onPlane(add(along, [(rnd() - .5) * .5, (rnd() - .5) * .5, (rnd() - .5) * .5]), n);
    set.push(p, t, n, (opts.hw || 0.035) * rr(.8, 1.2), (opts.hl || 0.09) * rr(.8, 1.2), pal, mat, opts.tw ? opts.tw(p) : 0, 1, 0.08);

}

    const p = add(add(a, scl(ax, t)), scl(n, r));
    const tt = onPlane(add(opts.around ? cross(z, n) : z, [(rnd() - .5) * .3, (rnd() - .5) * .3, (rnd() - .5) * .3]), n);
    set.push(p, tt, n, (opts.hw || 0.03) * rr(.8, 1.2), (opts.hl || 0.08) * rr(.8, 1.2), pal, opts.mat || 0, opts.tw ? opts.tw(t) : 0, 1, 0.08);

// ===================================================== PHYSICS
const BALL_R = 0.7, GRAV = 22, JUMP_V = 8.6, WORLD_LIMIT = 410;
class BuiltinPhysics {
  constructor(start) { this.name = '內建簡易物理'; this.pos = start.slice(); this.vel = [0, 0, 0]; this.grounded = false; }
  groundAt(x, z, footY) {
    let g = H(x, z);
    if (Math.abs(x) < 2.6) { const d = deckY(z); if (d > g && footY > d - 0.9) g = d; }
    return g;
  }
  step(dt, want, jump) {
    const p = this.pos, v = this.vel;
    v[0] = want[0]; v[2] = want[2]; v[1] -= GRAV * dt;
    if (jump && this.grounded) { v[1] = JUMP_V; this.grounded = false; }
    let nx = p[0] + v[0] * dt, ny = p[1] + v[1] * dt, nz = p[2] + v[2] * dt;
    let support = this.groundAt(nx, nz, ny - BALL_R);
    for (const c of colliders) {
      if (c.kind === 'bridge') continue;
      const dx = nx - c.c[0], dz = nz - c.c[2]; if (dx * dx + dz * dz > 100) continue;

  const aspect = canvas.width / canvas.height, fov = (aspect < 1 ? 72 : cam.fov) * Math.PI / 180;
  const proj = M4.persp(fov, aspect, 0.15, 4000), view = M4.lookAt(eye, look, [0, 1, 0]), VP = M4.mul(proj, view);
  const viewInfo = { eye, projY: proj[5] };
  // ---- lights: lantern + nearest static lights
  const hd = rider.heading;
  const root = M4.chain(M4.T(rider.pos[0], rider.pos[1], rider.pos[2]), M4.Ry(hd));
  const bob = ph.grounded ? Math.sin(rider.gait * Math.PI * 4) * 0.045 * clamp(horiz / 8, 0, 1) : 0.03;
  const pitchB = ph.grounded ? Math.sin(rider.gait * Math.PI * 2) * 0.035 * clamp(horiz / 8, 0, 1) : -ph.vel[1] * 0.012;
  const bodyM = M4.chain(root, M4.T(0, bob + 0.0, 0), M4.Rx(pitchB));
  const riderM = M4.chain(bodyM, M4.T(0, Math.sin(rider.gait * Math.PI * 4 + 0.6) * 0.03, 0));
  rider.swingV += (-rider.swing * 40 - rider.swingV * 3 + (ph.grounded ? Math.sin(rider.gait * Math.PI * 4) * 6 * clamp(horiz / 8, 0, 1) : -ph.vel[1] * 0.8)) * dt;
  rider.swing += rider.swingV * dt;
  const lanternM = M4.chain(riderM, M4.T(-0.57, 2.08, 0.31), M4.Rx(rider.swing * 0.5 + rider.speed * 0.02), M4.Rz(rider.swing * 0.2));
  const lpos = M4.apply(lanternM, [0, -0.27, 0]);
  const flick = 1 + 0.06 * Math.sin(state.time * 13) + 0.04 * Math.sin(state.time * 31);
  lightLP.set([lpos[0], lpos[1], lpos[2], 13]); lightLC.set([1.0, 0.6, 0.26, 1.0 * flick]);
  const ref = state.tour ? eye : rider.pos;
  const near = staticLights.filter(l => l.i > 0).map(l => [l, (l.p[0] - ref[0]) ** 2 + (l.p[2] - ref[2]) ** 2]).sort((x, y) => x[1] - y[1]).slice(0, 7);
  for (let i = 1; i < 8; i++) { const l = near[i - 1]; if (l) { lightLP.set([...l[0].p, l[0].r], i * 4); lightLC.set([...l[0].c, l[0].i], i * 4); } else { lightLP.set([0, -999, 0, 0.001], i * 4); lightLC.set([0, 0, 0, 0], i * 4); } }
  // ---- draw
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.08, 0.13, 0.3, 1); gl.clearDepth(1);
  gl.depthMask(true); gl.colorMask(true, true, true, true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND);
  const planes = frustumPlanes(VP);
  let drawn = 0;
  if (HAS_AA) gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  // 1) reflections (mirrored strokes) — later masked by the water surface
  setCommon(progWorld, VP, viewInfo);
  drawn += drawChunks(MIRRORset, planes, viewInfo);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  // 2) water surface: darkens the reflections and blocks the river bed
  setCommon(progSolid, VP, viewInfo);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.uniform4f(progSolid.u.uTint, 0.03, 0.06, 0.15, 0.42);
  gl.bindVertexArray(waterSolid.vao); gl.drawElements(gl.TRIANGLES, waterSolid.count, gl.UNSIGNED_INT, 0);
  gl.disable(gl.BLEND);
  // 3) underpainting (solid silhouettes), pushed slightly back
  gl.uniform4f(progSolid.u.uTint, 0, 0, 0, 0);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(2, 6);
  gl.bindVertexArray(solids.vao); gl.drawElements(gl.TRIANGLES, solids.count, gl.UNSIGNED_INT, 0);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  if (HAS_AA) gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  // 4) opaque world strokes
  setCommon(progWorld, VP, viewInfo);
  drawn += drawChunks(Wset, planes, viewInfo);
  // dynamic parts: windmill blades, horse, rider
  const bladeM = M4.chain(M4.T(...bladeHub), M4.Ry(bladeYaw), M4.Rz(state.time * 0.55));
  drawn += drawPart(bladePart, bladeM);
  drawn += drawPart(HORSE.body, bodyM);
  const gaitP = rider.gait, fast = horiz > 7.5, sp = clamp(horiz / 9, 0, 1);
  const offs = fast ? [0.5, 0.6, 0.0, 0.1] : [0.0, 0.5, 0.5, 0.0];
  HORSE.legs.forEach((L, i) => {
    let swing, knee;
    if (rider.air > 0.3 && !ph.grounded) { swing = L.kind === 'F' ? -0.65 : 0.55; knee = L.kind === 'F' ? 1.3 : -0.9; swing *= rider.air; knee *= rider.air; }
    else {
      const phs = (gaitP + offs[i]) * Math.PI * 2, amp = (fast ? 0.62 : 0.42) * sp;
      swing = -Math.sin(phs) * amp;
      const lift = Math.max(0, Math.cos(phs)) * sp;
      knee = L.kind === 'F' ? lift * 1.1 : -lift * 0.7;
    }
    const upM = M4.chain(bodyM, M4.T(...L.hip), M4.Rx(swing));
    drawn += drawPart(L.up, upM);
    drawn += drawPart(L.lo, M4.chain(upM, M4.T(...L.knee), M4.Rx(knee)));
  });
  drawn += drawPart(HORSE.rider, riderM);
  drawn += drawPart(HORSE.cape, riderM);
  drawn += drawPart(HORSE.lantern, lanternM);
  // 5) grass generated around the camera
  setCommon(progGrass, VP, viewInfo);
  const gc = state.tour ? eye : lerp3(eye, rider.pos, 0.6);
  gl.uniform3f(progGrass.u.uGC, gc[0], 0, gc[2]); gl.uniform1f(progGrass.u.uGS, GRASS.S); gl.uniform1i(progGrass.u.uGSide, GRASS.side); gl.uniform1f(progGrass.u.uGR, GRASS.R);
  if (eye[1] - H(eye[0], eye[2]) < 40) { gl.bindVertexArray(grassVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, GRASS.count); drawn += GRASS.count; }
  // 6) water strokes, blended
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  setCommon(progWorld, VP, viewInfo);
  gl.uniform1f(progWorld.u.uAlphaCut, 0.02); gl.uniform1f(progWorld.u.uAlphaMul, 0.8);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  drawn += drawChunks(WATERset, planes, viewInfo);
  gl.depthMask(true); gl.disable(gl.BLEND);
  // 7) sky, painted last behind everything
  if (HAS_AA) gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  setCommon(progSky, VP, viewInfo);
  gl.bindVertexArray(SKY.vao); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, SKY.count); drawn += SKY.count;
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  gl.bindVertexArray(null);
  state.drawn = drawn;
  // ---- HUD
  if ((state.hudT = (state.hudT || 0) + dt) > 0.25) {
    state.hudT = 0;
    $('stats').textContent = `FPS ${state.fps.toFixed(0)}　解析度 ${(state.scale * 100).toFixed(0)}% (${canvas.width}×${canvas.height})\n筆觸 ${(state.total / 1e6).toFixed(2)}M，本幀 ${(drawn / 1e3).toFixed(0)}k\n物理 ${ph.name}${state.tour ? '　巡遊中' : ''}`;
  }
}

// ===================================================== BOOT
async function boot() {
  const physP = loadRapier().then(R => ({ R }), e => ({ err: e }));
  const steps = [['鋪草地與小徑…', genTerrain], ['堆疊三層山脈…', genMountains], ['引一條河…', genRiver], ['砌石橋…', genBridge],
    ['蓋村莊與教堂…', genVillage], ['立起風車…', genWindmill], ['種向日葵…', genSunflowers], ['收割麥田…', genWheat], ['栽柏樹…', genVegetation],
    ['擺放柵欄、石牆、倒木…', genObstacles], ['畫星空漩渦…', genSky], ['為騎士與棕馬上色…', buildRider]];
  for (const [msg, fn] of steps) { loadMsg(msg); await nextFrame(); fn(); }
  loadMsg('上傳筆觸到顯示卡…'); await nextFrame();
  state.total = W.n + WATER.n + MIRROR.n + SKY.n;
  Wset = uploadChunked(W); WATERset = uploadChunked(WATER); MIRRORset = uploadChunked(MIRROR); uploadPlain(SKY);
  solids.upload(); waterSolid.upload();
  loadMsg('等待物理引擎…'); await nextFrame();
  const a0 = -60 * Math.PI / 180, start = [Math.cos(a0) * RING_R, 0, Math.sin(a0) * RING_R]; start[1] = H(start[0], start[2]) + BALL_R + 0.05;
  const res = await physP;
  if (res.R) { try { state.physics = new RapierPhysics(res.R, start); } catch (e) { console.warn('Rapier init failed', e); } }
  if (!state.physics) state.physics = new BuiltinPhysics(start);
  rider.heading = -a0; cam.yaw = rider.heading;
  if (params.has('tour')) setTour(true);
  if (params.has('manual')) setAuto(false);
  $('loading').style.display = 'none';
  state.ready = true;
  window.__starry = { state, cam, rider, keys, input, setTour, setAuto, tourPose, H, obstacles, simStep, get backend() { return state.physics.name; } };
}
boot().catch(e => { console.error(e); $('err').style.display = 'flex'; $('err').textContent = '載入失敗：' + e.message; });
requestAnimationFrame(frame);
</script>
